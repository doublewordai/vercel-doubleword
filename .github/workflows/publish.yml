name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Trusted publishing (OIDC) needs npm >= 11.5.1. No NPM_TOKEN is used;
      # npm exchanges the GitHub Actions OIDC token for publish rights, as
      # configured under the package's "Trusted Publisher" settings on npmjs.com.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
